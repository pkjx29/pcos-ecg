[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcos-ecg"
version = "0.1.0"
description = "Research prototype: ECG feature pipeline and leakage-safe model comparison for PCOS screening studies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Kumar Jha" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "imbalanced-learn>=0.12,<1",
    "xgboost>=2.0,<4",
    "pyyaml>=6.0,<7",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
# The original study's method: SDV synthesizers, Boruta, NeuroKit2 delineation, UMAP and SHAP.
# SDV installs PyTorch; on CPU-only machines install torch from the CPU index first.
study = [
    "sdv>=1.17,<3",
    "sdmetrics>=0.17,<1",
    "boruta>=0.4,<0.5",
    "neurokit2>=0.2.10,<0.4",
    "umap-learn>=0.5.5,<0.7",
    "shap>=0.46,<1",
]
app = ["streamlit>=1.46,<2"]
dev = ["pytest>=8.0,<10", "ruff>=0.4,<1", "streamlit>=1.46,<2"]

[project.scripts]
pcos-ecg = "pcos_ecg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
# The original team notebooks are published as they were, not restyled.
extend-exclude = ["original_study"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
