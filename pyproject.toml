[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcos-ecg"
version = "0.1.0"
description = "Research prototype: ECG feature pipeline and leakage-safe model comparison for PCOS screening studies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Kumar Jha" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "imbalanced-learn>=0.12",
    "xgboost>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "ruff>=0.4", "streamlit>=1.35"]

[project.scripts]
pcos-ecg = "pcos_ecg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
